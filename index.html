<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Goku vs Black Freeza — Arena 3D V2</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="hud">
 <header><span>ARENA 3D</span><b>GOKU <i>VS</i> BLACK FREEZA</b><span id="timer">00:00</span></header>
 <div class="bars">
  <div class="fighter"><label>GOKU • INSTINTO SUPERIOR</label><div class="track"><div id="hp1" class="fill blue"></div></div><small id="hp1txt">100%</small></div>
  <div class="fighter right"><label>BLACK FREEZA</label><div class="track"><div id="hp2" class="fill purple"></div></div><small id="hp2txt">100%</small></div>
 </div>
 <div id="status">Arena pronta. Inicie a batalha!</div>
 <div class="actions">
  <button id="start">Iniciar batalha</button><button id="pause">Pausar</button><button id="reset">Reiniciar</button>
 </div>
</div>
<aside id="livePanel">
 <b>PAINEL DE INTERAÇÃO • DEMO</b>
 <div class="actions compact">
  <button data-event="comment">Simular comentário</button>
  <button data-event="gift">Simular presente</button>
 </div>
 <div class="actions compact">
  <button id="transform">Transformar Goku</button>
  <button id="kame">Kamehameha</button>
  <button id="nova">Raio sombrio</button>
 </div>
 <div id="feed"><span>Sistema: eventos de demonstração ativados.</span></div>
</aside>
<div id="hint">Arraste para girar • Pinça/roda para aproximar</div>
<script type="module" src="main.js"></script>
</body></html>
